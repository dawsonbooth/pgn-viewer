<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f5c4a" />
    <meta name="description" content="Browser PGN viewer. Files stay local." />
    <title>PGN Viewer</title>
    <script>
      // Apply a saved theme override before first paint; absent means follow the OS.
      try {
        const t = localStorage.getItem('pgn-viewer:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body class="h-full bg-ground text-ink">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
