name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let in-flight deploys finish so Pages is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun run build
        env:
          # e.g. /pgn-viewer — vite.config.ts turns this into `base`.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
